<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>立地評価 一次スクリーニング</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>立地評価 一次スクリーニング</h1>
  <p>地図で地点を選ぶと、土地の規制・周辺住宅との距離・市の基準・注意点を1ページにまとめます。各項目に「確認済み/未確認」と出典を付けます。</p>
</header>
<main>
  <div class="mapcol">
    <div id="presets" class="presets"></div>
    <div id="map"></div>
    <p class="attr">地図: 国土地理院 / 建物・道路・消防署: © OpenStreetMap contributors / 都市計画: 国土交通省 不動産情報ライブラリ</p>
  </div>
  <aside id="panel">
    <p id="proxyNote" class="note" hidden>用途地域・区域区分は、国のAPI用の中継サーバーが未設定のため「未確認」と表示されます(README参照)。</p>
    <div id="result"></div>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://maps.gsi.go.jp/js/muni.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
